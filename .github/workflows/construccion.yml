name: Construccion

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Empaquetar
        run: chmod +x mvnw && ./mvnw -B -DskipTests package
