# Secretos locales (clave de MySQL, correo y token). No se sube a GitHub.
spring.config.import=optional:classpath:application-local.properties

# ===== BASE DE DATOS =====
# En la nube defina DB_URL, DB_USERNAME y DB_PASSWORD. En local se usan estos valores.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_ventas}
spring.datasource.username=${DB_USERNAME:bodega_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true
spring.datasource.hikari.data-source-properties.useSSL=false
spring.datasource.hikari.data-source-properties.serverTimezone=UTC

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== THYMELEAF =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ===== UPLOAD DE ARCHIVOS =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== CONFIGURACION DE APLICACION =====
# Carpeta base de imágenes en resources. Subcarpetas: presentaciones, logo, slider, cliente, perfil, categoria, pedido
app.upload.dir=${UPLOAD_DIR:src/main/resources/imagen}
app.version=${APP_VERSION:1.0.0-candidato}

# ApiPeru: el token va en application-local.properties (API_PERU_TOKEN)
app.validacion.habilitada=true
app.validacion.api-url=https://apiperu.dev/api
app.validacion.api-token=${API_PERU_TOKEN:}

# ===== SERVIDOR =====
server.port=${PORT:8080}
spring.application.name=sistema-ventas-jesmar

# ===== LOGGING =====
logging.level.com.jesmar=DEBUG

# ===== AUTENTICACIÓN EN DOS PASOS (2FA) =====
app.2fa.habilitado=true
app.2fa.codigo-expiracion-minutos=5
app.2fa.mostrar-codigo-en-pantalla=false

# ===== CORREO (SMTP) - Código 2FA por email =====
# Usuario y contraseña de aplicación: application-local.properties
# https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===== Catálogo web — checkout =====
app.catalogo.costo-envio=10.00
app.catalogo.yape-celular=957779526
app.catalogo.plin-celular=957779526

# ===== API NODE (sincronización de productos) =====
app.node-api.enabled=${NODE_API_ENABLED:true}
app.node-api.base-url=http://localhost:3000