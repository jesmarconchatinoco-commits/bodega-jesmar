<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: commonHead('Horarios de Atención')}"></head>

<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
    <div th:replace="~{layout :: header}"></div>
    <div th:replace="~{layout :: sidebar}"></div>

    <div class="content-wrapper">
        <section class="content-header px-3 py-3">
            <div class="container-fluid">
                <div class="row mb-2 align-items-center">
                    <div class="col-sm-6">
                        <h1 class="m-0"><i class="fas fa-clock mr-2"></i>Gestión de Horarios de Atención</h1>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item"><a href="/dashboard">Inicio</a></li>
                            <li class="breadcrumb-item active">Horarios de Atención</li>
                        </ol>
                    </div>
                </div>
            </div>
        </section>

        <section class="content px-3">
                <div class="card card-outline card-primary erp-page-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="card-title mb-0">
                            <i class="fas fa-calendar-alt mr-1"></i> Fechas y horarios de recojo en tienda
                        </h3>
                        <button type="button" class="btn btn-primary btn-sm btn-erp-nuevo" id="btnNuevaFecha"
                            data-toggle="tooltip" title="Agregar nueva fecha de atención">
                            <i class="fas fa-plus-circle mr-1"></i> Nueva fecha
                        </button>
                </div>
                <div class="card-body p-0 tabla-card-body">
                    <div id="horariosContenedor" class="p-3">
                        <p class="text-muted text-center py-4 mb-0">Cargando horarios...</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Modal Gestión de Horarios de Atención -->
    <div class="modal fade modal-erp" id="modalHorarioAtencion" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalHorarioTitulo">
                        <i class="fas fa-clock mr-2"></i>Gestión de Horarios de Atención
                    </h5>
                    <button type="button" class="close text-white" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="fechaAtencionId">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Fecha de atención *</label>
                            <input type="date" class="form-control" id="fechaAtencionInput">
                        </div>
                        <div class="form-group col-md-6">
                            <label>Estado</label>
                            <select class="form-control" id="fechaAtencionActivo">
                                <option value="true">Habilitada</option>
                                <option value="false">Deshabilitada</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="mb-0"><i class="fas fa-list mr-1"></i> Horarios del día</h6>
                        <button type="button" class="btn btn-outline-primary btn-sm" id="btnAgregarHorario">
                            <i class="fas fa-plus mr-1"></i> Agregar horario
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-sm table-bordered mb-0">
                            <thead class="thead-light">
                                <tr>
                                    <th>Inicio</th>
                                    <th>Fin</th>
                                    <th class="text-center">Cupo máx.</th>
                                    <th class="text-center">Reservados</th>
                                    <th class="text-center">Estado</th>
                                    <th class="text-center" style="width:50px;"></th>
                                </tr>
                            </thead>
                            <tbody id="tablaHorariosModal"></tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardarFechaAtencion">
                        <i class="fas fa-save mr-1"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
    <script th:replace="~{layout :: scripts}"></script>
    <script src="/js/horarios-atencion-acciones.js"></script>
</div>
</body>

</html>
