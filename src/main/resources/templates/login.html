<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Bodega Jesmar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/login.css" />
</head>

<body>
    <div class="login-bg-shapes" aria-hidden="true">
        <span class="shape shape-1"></span>
        <span class="shape shape-2"></span>
        <span class="shape shape-3"></span>
    </div>

    <div class="login-container">
        <div class="card login-card">
            <div class="card-header">
                <div class="brand-row">
                    <div class="brand-badge" th:classappend="${logoUrl != null} ? ' brand-badge--with-logo' : ''">
                        <img th:if="${logoUrl != null}"
                             th:src="${logoUrl}"
                             class="brand-logo-img"
                             alt="Bodega Jesmar">
                        <i th:unless="${logoUrl != null}" class="fas fa-warehouse" aria-hidden="true"></i>
                    </div>
                    <h1>Bodega <span class="brand-name">Jesmar</span></h1>
                </div>
            </div>
            <div class="card-body">
                <form th:action="@{/login}" method="post" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="usuario">
                            <i class="fas fa-user" aria-hidden="true"></i> Usuario
                        </label>
                        <div class="icon-input">
                            <i class="fas fa-user" aria-hidden="true"></i>
                            <input type="text" id="usuario" name="usuario" class="form-control"
                                placeholder="Ingresa tu usuario" autocomplete="username" required
                                pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]+" title="Solo letras" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">
                            <i class="fas fa-lock" aria-hidden="true"></i> Contraseña
                        </label>
                        <div class="input-group input-group-password">
                            <span class="input-group-text"><i class="fas fa-lock" aria-hidden="true"></i></span>
                            <input type="password" id="password" name="password" class="form-control"
                                placeholder="Ingresa tu contraseña" autocomplete="current-password" required />
                            <button type="button" class="btn btn-toggle-password"
                                    onclick="togglePass('password', this)"
                                    aria-label="Mostrar contraseña" title="Mostrar contraseña">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
                        <span>Ingresar</span>
                    </button>

                    <div class="text-center mt-2">
                        <a th:href="@{/recuperar-contrasena}" class="login-forgot-password">olvidaste tu contraseña</a>
                    </div>
                </form>

                <div th:if="${param.error}" class="alert alert-danger mt-3" role="alert">
                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                    Usuario o contraseña incorrectos.
                </div>

                <div th:if="${param.logout}" id="alert-logout" class="alert alert-success mt-3" role="alert">
                    <i class="fas fa-check-circle" aria-hidden="true"></i>
                    Sesión cerrada correctamente.
                </div>

                <div class="footer-text">
                    <p><i class="fas fa-copyright" aria-hidden="true"></i> 2026 Bodega Jesmar</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/toggle-password.js"></script>
    <script src="/js/login.js"></script>
</body>

</html>
