<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nueva contraseña - Bodega Jesmar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/login.css" />
</head>

<body>
    <div class="login-bg-shapes" aria-hidden="true">
        <span class="shape shape-1"></span>
        <span class="shape shape-2"></span>
        <span class="shape shape-3"></span>
    </div>

    <div class="login-container">
        <div class="card login-card">
            <div class="card-header">
                <div class="brand-row">
                    <div class="brand-badge">
                        <i class="fas fa-key" aria-hidden="true"></i>
                    </div>
                    <h1>Nueva <span class="brand-name">contraseña</span></h1>
                </div>
            </div>
            <div class="card-body">
                <p class="text-muted small mb-3">
                    Cree una contraseña segura. Debe incluir letras, números y al menos un punto (.).
                </p>

                <div th:if="${mensajeError != null}" class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                    <span th:text="${mensajeError}"></span>
                </div>

                <form id="form-restablecer" th:action="@{/recuperar-contrasena/restablecer}" method="post" novalidate>
                    <input type="hidden" name="token" th:value="${token}">

                    <div class="form-group">
                        <label class="form-label" for="password">
                            <i class="fas fa-lock" aria-hidden="true"></i> Nueva contraseña
                        </label>
                        <div class="input-group input-group-password">
                            <span class="input-group-text"><i class="fas fa-lock" aria-hidden="true"></i></span>
                            <input type="password" id="password" name="password" class="form-control"
                                   placeholder="Mínimo 8 caracteres" autocomplete="new-password" required
                                   minlength="8" />
                            <button type="button" class="btn btn-toggle-password"
                                    onclick="togglePass('password', this)"
                                    aria-label="Mostrar contraseña" title="Mostrar contraseña">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirmacion">
                            <i class="fas fa-lock" aria-hidden="true"></i> Confirmar contraseña
                        </label>
                        <div class="input-group input-group-password">
                            <span class="input-group-text"><i class="fas fa-lock" aria-hidden="true"></i></span>
                            <input type="password" id="confirmacion" name="confirmacion" class="form-control"
                                   placeholder="Repita la contraseña" autocomplete="new-password" required
                                   minlength="8" />
                            <button type="button" class="btn btn-toggle-password"
                                    onclick="togglePass('confirmacion', this)"
                                    aria-label="Mostrar contraseña" title="Mostrar contraseña">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <ul class="small text-muted mb-3 ps-3" id="reglas-contrasena">
                        <li id="regla-longitud">Al menos 8 caracteres</li>
                        <li id="regla-letras">Incluir letras</li>
                        <li id="regla-numeros">Incluir números</li>
                        <li id="regla-puntos">Incluir al menos un punto (.)</li>
                        <li id="regla-coinciden">Las contraseñas coinciden</li>
                    </ul>

                    <div id="error-cliente" class="alert alert-danger py-2" style="display:none;" role="alert"></div>

                    <button type="submit" class="btn-login" id="btn-guardar">
                        <i class="fas fa-save" aria-hidden="true"></i>
                        <span>Guardar contraseña</span>
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="login-forgot-password">
                        <i class="fas fa-arrow-left mr-1"></i> Volver al login
                    </a>
                </div>

                <div class="footer-text">
                    <p><i class="fas fa-copyright" aria-hidden="true"></i> 2026 Bodega Jesmar</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/toggle-password.js"></script>
    <script src="/js/contrasena-segura.js"></script>
    <script src="/js/restablecer-contrasena.js"></script>
</body>

</html>
