<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar contraseña - Bodega Jesmar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/login.css" />
</head>

<body>
    <div class="login-bg-shapes" aria-hidden="true">
        <span class="shape shape-1"></span>
        <span class="shape shape-2"></span>
        <span class="shape shape-3"></span>
    </div>

    <div class="login-container">
        <div class="card login-card">
            <div class="card-header">
                <div class="brand-row">
                    <div class="brand-badge" th:classappend="${logoUrl != null} ? ' brand-badge--with-logo' : ''">
                        <img th:if="${logoUrl != null}"
                             th:src="${logoUrl}"
                             class="brand-logo-img"
                             alt="Bodega Jesmar">
                        <i th:unless="${logoUrl != null}" class="fas fa-warehouse" aria-hidden="true"></i>
                    </div>
                    <h1>Recuperar <span class="brand-name">contraseña</span></h1>
                </div>
            </div>
            <div class="card-body">
                <p class="text-muted small mb-3" th:if="${mostrarFormulario}">
                    Ingrese el correo electrónico registrado en su cuenta. Le enviaremos un enlace para crear una nueva contraseña.
                </p>

                <div th:if="${mensajeExito != null}" class="alert alert-success" role="alert">
                    <i class="fas fa-check-circle" aria-hidden="true"></i>
                    <span th:text="${mensajeExito}"></span>
                </div>

                <div th:if="${mensajeError != null}" class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                    <span th:text="${mensajeError}"></span>
                </div>

                <form th:if="${mostrarFormulario}" th:action="@{/recuperar-contrasena}" method="post">
                    <div class="form-group">
                        <label class="form-label" for="correo">
                            <i class="fas fa-envelope" aria-hidden="true"></i> Correo electrónico
                        </label>
                        <div class="icon-input">
                            <i class="fas fa-envelope" aria-hidden="true"></i>
                            <input type="email" id="correo" name="correo" class="form-control"
                                   placeholder="ejemplo@correo.com" autocomplete="email" required />
                        </div>
                    </div>

                    <button type="submit" class="btn-login">
                        <i class="fas fa-paper-plane" aria-hidden="true"></i>
                        <span>Enviar enlace</span>
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="login-forgot-password">
                        <i class="fas fa-arrow-left mr-1"></i> Volver al login
                    </a>
                </div>

                <div class="footer-text">
                    <p><i class="fas fa-copyright" aria-hidden="true"></i> 2026 Bodega Jesmar</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
