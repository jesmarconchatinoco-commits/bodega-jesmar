<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Encabezado de marca para correos -->
<table th:fragment="header" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
       style="border-collapse:collapse;">
    <tr>
        <td style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);background-color:#667eea;
                   padding:28px 32px;border-radius:12px 12px 0 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                   style="border-collapse:collapse;">
                <tr>
                    <td width="56" valign="middle" style="padding-right:14px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0"
                               style="border-collapse:collapse;width:52px;height:52px;background:rgba(255,255,255,0.95);
                                      border-radius:10px;">
                            <tr>
                                <td align="center" valign="middle" style="padding:6px;">
                                    <img th:if="${tieneLogo}" src="cid:logo" alt="Bodega Jesmar" width="40" height="40"
                                         style="display:block;border:0;outline:none;max-width:40px;max-height:40px;object-fit:contain;" />
                                    <span th:unless="${tieneLogo}"
                                          style="font-size:22px;line-height:1;">&#127978;</span>
                                </td>
                            </tr>
                        </table>
                    </td>
                    <td valign="middle">
                        <p style="margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
                                  font-size:13px;color:rgba(255,255,255,0.88);letter-spacing:0.3px;">
                            Bodega Jesmar
                        </p>
                        <h1 th:text="${tituloEmail}"
                            style="margin:4px 0 0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
                                   font-size:22px;font-weight:700;color:#ffffff;line-height:1.25;">
                            Título del correo
                        </h1>
                        <p th:if="${subtitulo != null and !#strings.isEmpty(subtitulo)}"
                           th:text="${subtitulo}"
                           style="margin:8px 0 0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
                                  font-size:14px;color:rgba(255,255,255,0.92);line-height:1.45;">
                            Subtítulo
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

<!-- Pie de correo -->
<table th:fragment="footer" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
       style="border-collapse:collapse;">
    <tr>
        <td style="padding:22px 32px 28px;border-top:1px solid #eef2f7;background:#fafbff;
                   border-radius:0 0 12px 12px;">
            <p style="margin:0 0 6px;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
                      font-size:12px;color:#94a3b8;line-height:1.5;text-align:center;">
                Este es un mensaje automático de <strong style="color:#64748b;">Bodega Jesmar</strong>.
                No responda a este correo.
            </p>
            <p style="margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
                      font-size:12px;color:#cbd5e1;line-height:1.5;text-align:center;">
                &copy; <span th:text="${anio}">2026</span> Bodega Jesmar. Todos los derechos reservados.
            </p>
        </td>
    </tr>
</table>

</body>
</html>
