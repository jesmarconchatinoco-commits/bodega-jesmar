<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Movimientos - ' + ${data.nombre}">Movimientos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; color: #222; }
        h1 { font-size: 1.3rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f5f5f5; }
        .total { font-weight: bold; text-align: right; margin-top: 12px; color: #198754; }
        .no-print { margin-bottom: 16px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
    <div class="no-print">
        <button onclick="window.print()">Imprimir / Guardar PDF</button>
        <button onclick="window.close()">Cerrar</button>
    </div>

    <h1>Movimientos de la Presentación</h1>
    <p><strong>Producto:</strong> <span th:text="${data.producto}"></span></p>
    <p><strong>Presentación:</strong> <span th:text="${data.presentacion}"></span></p>
    <p><strong>Stock actual:</strong> <span th:text="${data.stock}"></span></p>

    <table>
        <thead>
            <tr>
                <th>Fecha Venta</th>
                <th>Nº Documento</th>
                <th>Precio Venta</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="m : ${data.movimientos}">
                <td th:text="${m.fecha}"></td>
                <td th:text="${m.numeroDocumento}"></td>
                <td th:text="'S/ ' + ${#numbers.formatDecimal(m.precio, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${m.cantidad}"></td>
                <td th:text="'S/ ' + ${#numbers.formatDecimal(m.subtotal, 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(data.movimientos)}">
                <td colspan="5" style="text-align:center;color:#666;">Sin movimientos de venta</td>
            </tr>
        </tbody>
    </table>

    <div class="total" th:text="'Total Vendido: S/ ' + ${#numbers.formatDecimal(data.totalVendido, 1, 'COMMA', 2, 'POINT')}"></div>
</body>
</html>
